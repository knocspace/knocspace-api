services:
  postgres:
    image: postgres:17-alpine
    container_name: knocspace-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: knocspace
      POSTGRES_PASSWORD: knocspace
      POSTGRES_DB: knocspace
    volumes:
      - knocspace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knocspace -d knocspace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knocspace-pgdata:
